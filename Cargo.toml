[package]
name = "codeany"
version = "0.1.4"
edition = "2024"
description = "A local-first coding agent"
license = "AGPL-3.0-only"
repository = "https://github.com/thinkany-ai/codeany"

[dependencies]
gpui-kit = { version = "0.8.1", features = [
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-diff",
] }
alacritty_terminal = "0.26"
anyhow = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "ico", "webp"] }
resvg = { version = "0.46", default-features = false }
smallvec = "1"
gpui-webview = "0.8.0"
wry = { package = "lb-wry", version = "0.53.3" }
rusqlite = { version = "0.40", features = ["bundled"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agl = { git = "https://github.com/thinkany-ai/agl", tag = "v0.3.19" }
nex = { git = "https://github.com/thinkany-ai/nex", rev = "12ea252" }
tokio-tungstenite = "0.26"
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
snow = "0.9"
hkdf = "0.12"
sha2 = "0.10"
local-ip-address = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
