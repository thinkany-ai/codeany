[package]
name = "dscode"
version = "0.1.0"
edition = "2024"
description = "A lightweight code editor built with GPUI"

[dependencies]
gpui-kit = { version = "0.8.0", features = [
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-toml",
    "tree-sitter-yaml",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-diff",
] }
alacritty_terminal = "0.26"
anyhow = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
gpui-webview = "0.8.0"
wry = { package = "lb-wry", version = "0.53.3" }
rusqlite = { version = "0.40", features = ["bundled"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agl = { git = "https://github.com/thinkany-ai/agl", rev = "e52303f" }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
