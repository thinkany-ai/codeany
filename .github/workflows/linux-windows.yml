# Builds and packages CodeAny for Linux and Windows. macOS uses macos.yml.
# Packages are uploaded as workflow
# artifacts; on a v* tag they are also attached to that tag's GitHub Release.
name: Linux & Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libssl-dev libzstd-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev \
            libdbus-1-dev libpipewire-0.3-dev libgbm-dev libegl1-mesa-dev
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Package
        run: |
          VERSION=$(cargo pkgid --locked | sed 's/.*[#@]//')
          mkdir -p target/packages
          cargo install cargo-deb --locked
          cargo deb --no-build --output "target/packages/codeany_${VERSION}_amd64.deb"
          STAGE="target/packages/CodeAny_${VERSION}_linux_x86_64"
          mkdir -p "$STAGE"
          cp target/release/codeany packaging/linux/codeany.desktop "$STAGE/"
          cp assets/codeany.png "$STAGE/codeany.png"
          tar -czf "$STAGE.tar.gz" -C target/packages "$(basename "$STAGE")"
          rm -rf "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: codeany-linux-x86_64
          path: target/packages/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo pkgid --locked) -replace '.*[#@]', ''
          New-Item -ItemType Directory -Force target/packages | Out-Null
          magick assets/codeany.png -define icon:auto-resize=256,128,64,48,32,16 target/packages/codeany.ico
          iscc /DVersion=$version /DSource=..\..\target\release packaging\windows\codeany.iss
          Compress-Archive -Path target/release/codeany.exe -DestinationPath "target/packages/CodeAny_${version}_windows_x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: codeany-windows-x64
          path: |
            target/packages/*.exe
            target/packages/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The macOS release usually creates the Release first; create a
          # draft only if it does not exist yet.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "CodeAny ${TAG#v}" --notes ""
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
            packages/*.deb packages/*.tar.gz packages/*.exe packages/*.zip
